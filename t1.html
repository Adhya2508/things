<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanguard | Enterprise Portfolio Intelligence</title>
  <style>
    :root {
      --bg-base: #06080d;
      --bg-surface: #0d111a;
      --bg-surface-elevated: #131926;
      --bg-input: #090c14;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: #6366f1;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dark: #6b7280;
      --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      --accent-glow: rgba(79, 70, 229, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Command Header */
    .header {
      height: 56px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .brand-icon svg { width: 16px; height: 16px; fill: #fff; }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      font-size: 10px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      text-transform: uppercase;
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: monospace;
    }

    /* Main Dashboard Layout Split */
    .app-viewport {
      flex: 1;
      display: grid;
      grid-template-columns: 380px 1fr;
      overflow: hidden;
    }

    /* Left Control Sidebar */
    .control-panel {
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
    }

    .panel-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dark);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric-card {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      padding: 12px;
      border-radius: 8px;
    }

    .metric-card .val {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-top: 4px;
    }

    .metric-card .lbl {
      font-size: 10px;
      color: var(--text-dark);
      text-transform: uppercase;
    }

    .quick-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-chip {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      padding: 10px 14px;
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .action-chip:hover {
      border-color: var(--border-accent);
      color: #fff;
      background: var(--bg-surface-elevated);
      transform: translateX(2px);
    }

    /* Right Main Terminal & Data Workspace */
    .workspace {
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
      overflow: hidden;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chat-container::-webkit-scrollbar { width: 4px; }
    .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* Message Boxes */
    .message {
      padding: 16px 20px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.6;
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: #1e293b;
      border: 1px solid var(--border-subtle);
      color: #fff;
      max-width: 70%;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    /* Intent Badges */
    .intent-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    /* Data Table Custom Visuals */
    .data-table-container {
      margin-top: 14px;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-input);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      text-align: left;
    }

    .data-table th, .data-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .data-table th {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .data-table tr:hover { background: rgba(255, 255, 255, 0.02); }

    /* Typing Indicator */
    .typing { display: flex; gap: 5px; padding: 4px 0; }
    .typing span { width: 5px; height: 5px; background: var(--border-accent); border-radius: 50%; animation: pulse 1s infinite alternate; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { from { opacity: 0.2; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }

    /* Bottom Execution Bar */
    .input-bar-container {
      padding: 16px 24px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
    }

    .input-bar {
      display: flex;
      gap: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      padding: 6px 6px 6px 16px;
      border-radius: 8px;
      transition: border-color 0.2s;
    }

    .input-bar:focus-within {
      border-color: var(--border-accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .input-bar input {
      flex: 1;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 13.5px;
      outline: none;
    }

    .input-bar button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: var(--accent-gradient);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .input-bar button:hover { opacity: 0.9; }
    .input-bar button:disabled { background: var(--bg-surface); color: var(--text-dark); cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div class="brand-title">
        VANGUARD <span>Risk Engine v2</span>
      </div>
    </div>
    <div class="system-status">
      <div>PIPELINE: <span style="color: #10b981;">2-STAGE DETERMINISTIC</span></div>
      <div>LATENCY: <span style="color: #10b981;">18ms</span></div>
    </div>
  </div>

  <!-- App Body Layout -->
  <div class="app-viewport">

    <!-- Left Sidebar Control Panel -->
    <div class="control-panel">
      <div class="panel-header">Engine Metrics</div>
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="lbl">LLM Hops</div>
          <div class="val">2 Fixed</div>
        </div>
        <div class="metric-card">
          <div class="lbl">Injection Guard</div>
          <div class="val" style="color: #10b981;">Active</div>
        </div>
      </div>

      <div class="panel-header" style="margin-top: 10px;">Quick Presets</div>
      <div class="quick-actions">
        <button class="action-chip" onclick="sendSuggestion('give me top 10 users with max balance')">
          <span>Top Balances</span>
          <span style="font-size: 10px; color: var(--text-dark);">→</span>
        </button>
        <button class="action-chip" onclick="sendSuggestion('what is the average credit limit across all users')">
          <span>Portfolio Averages</span>
          <span style="font-size: 10px; color: var(--text-dark);">→</span>
        </button>
        <button class="action-chip" onclick="sendSuggestion('audit customer C10001')">
          <span>Audit Customer C10001</span>
          <span style="font-size: 10px; color: var(--text-dark);">→</span>
        </button>
      </div>
    </div>

    <!-- Right Chat/Data Workspace -->
    <div class="workspace">
      <div class="chat-container" id="chat">
        <div class="message assistant">
          Engine ready. Select a query preset from the sidebar or enter a prompt below to trigger the 2-stage execution pipeline.
        </div>
      </div>

      <!-- Execution Query Input -->
      <div class="input-bar-container">
        <div class="input-bar">
          <input type="text" id="user-input" placeholder="Execute customer segmentation query..." onkeypress="if(event.key==='Enter')sendMessage()">
          <button id="send-btn" onclick="sendMessage()">Run Query</button>
        </div>
      </div>
    </div>

  </div>

  <script>
  const WEBHOOK_URL = "http://3.231.86.7:5678/webhook/bank-agent";

  const chat = document.getElementById('chat');
  const input = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  function addMessage(html, role) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'message assistant';
    div.id = 'typing-indicator';
    div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function formatMarkdown(text) {
    return String(text)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/`(.*?)`/g, '<code style="background:rgba(255,255,255,0.06); padding:2px 5px; border-radius:4px; font-family:monospace; color:#818cf8;">$1</code>')
      .replace(/\n/g, '<br>');
  }

  function buildTable(rows) {
    if (!Array.isArray(rows) || rows.length === 0) return '';
    const cols = Object.keys(rows[0]);
    let html = '<div class="data-table-container"><table class="data-table"><thead><tr>';
    cols.forEach(c => html += `<th>${c}</th>`);
    html += '</tr></thead><tbody>';
    rows.forEach(row => {
      html += '<tr>';
      cols.forEach(c => html += `<td>${row[c] ?? ''}</td>`);
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  function renderAssistantResponse(payload) {
    const summaryHtml = formatMarkdown(payload.summary || payload.output || 'No response.');
    const tag = payload.intent ? `<div class="intent-tag">${payload.intent}</div><br>` : '';
    const tableHtml = buildTable(payload.data);
    return `${tag}${summaryHtml}${tableHtml}`;
  }

  function sendSuggestion(text) {
    input.value = text;
    sendMessage();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(formatMarkdown(text), 'user');
    input.value = '';
    sendBtn.disabled = true;
    addTyping();

    try {
      const r = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: text })
      });

      removeTyping();

      if (!r.ok) {
        const err = await r.text();
        addMessage(`Error ${r.status}<br><br>${err}`, 'assistant');
        return;
      }

      const raw = await r.text();
      if (!raw) {
        addMessage('Empty response from server.', 'assistant');
        return;
      }

      const payload = JSON.parse(raw);
      addMessage(renderAssistantResponse(payload), 'assistant');

    } catch (e) {
      removeTyping();
      addMessage(`Connection error:<br>${e.message}`, 'assistant');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
  </script>
</body>
</html>
