<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Segmentation Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f1117; color: #e1e4e8; height: 100vh; display: flex; flex-direction: column; }
    .header { background: linear-gradient(135deg, #1a1f36 0%, #0d1117 100%); border-bottom: 1px solid #21262d; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .header h1 { font-size: 18px; font-weight: 600; color: #f0f6fc; }
    .header .subtitle { color: #8b949e; font-size: 12px; margin-top: 2px; }
    .chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-track { background: transparent; }
    .chat-container::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    .message { max-width: 78%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
    .message.user { align-self: flex-end; background: #1f6feb; color: #fff; border-bottom-right-radius: 4px; }
    .message.assistant { align-self: flex-start; background: #161b22; border: 1px solid #21262d; color: #c9d1d9; border-bottom-left-radius: 4px; max-width: 90%; }
    .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .data-table th, .data-table td { padding: 6px 10px; border: 1px solid #21262d; text-align: left; }
    .data-table th { background: #0d1117; color: #8b949e; font-weight: 500; }
    .data-table tr:nth-child(even) { background: #12161d; }
    .intent-tag { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #58a6ff; background: #0d1117; border: 1px solid #21262d; padding: 2px 8px; border-radius: 10px; margin-bottom: 6px; }
    .typing { display: flex; gap: 4px; padding: 12px 16px; }
    .typing span { width: 6px; height: 6px; background: #484f58; border-radius: 50%; animation: bounce 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
    .input-bar { border-top: 1px solid #21262d; padding: 16px 24px; display: flex; gap: 12px; background: #161b22; flex-shrink: 0; }
    .input-bar input { flex: 1; padding: 12px 16px; border: 1px solid #30363d; border-radius: 8px; background: #0d1117; color: #e1e4e8; font-size: 14px; outline: none; }
    .input-bar input:focus { border-color: #58a6ff; }
    .input-bar button { padding: 12px 24px; border: none; border-radius: 8px; background: #238636; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
    .input-bar button:hover { background: #2ea043; }
    .input-bar button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
    .suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .suggestion { padding: 6px 12px; border: 1px solid #30363d; border-radius: 16px; background: transparent; color: #8b949e; font-size: 12px; cursor: pointer; }
    .suggestion:hover { border-color: #58a6ff; color: #58a6ff; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Bank Segmentation Assistant</h1>
      <div class="subtitle">AI-Powered Customer Analytics</div>
    </div>
  </div>

  <div class="chat-container" id="chat">
    <div class="message assistant">
      Hello! I'm your Bank Customer Segmentation assistant.
      <div class="suggestions">
        <button class="suggestion" onclick="sendSuggestion('give me top 10 users with max balance')">Top balances</button>
        <button class="suggestion" onclick="sendSuggestion('what is the average credit limit across all users')">Portfolio average</button>
        <button class="suggestion" onclick="sendSuggestion('audit customer C10001')">Audit a customer</button>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <input type="text" id="user-input" placeholder="Ask about customer segmentation..." onkeypress="if(event.key==='Enter')sendMessage()">
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>
  const WEBHOOK_URL = "http://3.231.86.7:5678/webhook/bank-agent";

  const chat = document.getElementById('chat');
  const input = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  function addMessage(html, role) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'message assistant';
    div.id = 'typing-indicator';
    div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function formatMarkdown(text) {
    return String(text)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/`(.*?)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }

  function buildTable(rows) {
    if (!Array.isArray(rows) || rows.length === 0) return '';
    const cols = Object.keys(rows[0]);
    let html = '<table class="data-table"><thead><tr>';
    cols.forEach(c => html += `<th>${c}</th>`);
    html += '</tr></thead><tbody>';
    rows.forEach(row => {
      html += '<tr>';
      cols.forEach(c => html += `<td>${row[c] ?? ''}</td>`);
      html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function renderAssistantResponse(payload) {
    const summaryHtml = formatMarkdown(payload.summary || payload.output || 'No response.');
    const tag = payload.intent ? `<div class="intent-tag">${payload.intent}</div>` : '';
    const tableHtml = buildTable(payload.data);
    return `${tag}${summaryHtml}${tableHtml}`;
  }

  function sendSuggestion(text) {
    input.value = text;
    sendMessage();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(formatMarkdown(text), 'user');
    input.value = '';
    sendBtn.disabled = true;
    addTyping();

    try {
      const r = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: text })
      });

      removeTyping();

      if (!r.ok) {
        const err = await r.text();
        addMessage(`Error ${r.status}<br><br>${err}`, 'assistant');
        return;
      }

      const raw = await r.text();
      if (!raw) {
        addMessage('Empty response from server.', 'assistant');
        return;
      }

      const payload = JSON.parse(raw);
      addMessage(renderAssistantResponse(payload), 'assistant');

    } catch (e) {
      removeTyping();
      addMessage(`Connection error:<br>${e.message}`, 'assistant');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
  </script>
</body>
</html>
